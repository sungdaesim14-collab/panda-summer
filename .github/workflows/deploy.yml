# GitHub에 올릴 때마다 자동으로 앱을 빌드해서 GitHub Pages에 배포한다.
# (아버지가 할 일: GitHub 저장소 → Settings → Pages → Source 를 "GitHub Actions"로 한 번만 설정)

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: {}   # 버튼으로 수동 실행도 가능

permissions:
  contents: read
  pages: write
  id-token: write

# 배포는 한 번에 하나만 (겹치지 않게)
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
